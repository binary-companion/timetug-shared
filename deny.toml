    "cfg-if",
    "cpufeatures",
    "crypto-common",
    "dedup-benchmark",
    "digest",
    "displaydoc",
    "form_urlencoded",
    "getrandom",
    "hybrid-array",
    "icu_collections",
    "icu_locale_core",
    "icu_normalizer",
    "icu_normalizer_data",
    "icu_properties",
    "icu_properties_data",
    "icu_provider",
    "idna",
    "idna_adapter",
    "itoa",
    "jiff",
    "jiff-core",
    "jiff-static",
    "jiff-tzdb",
    "jiff-tzdb-platform",
    "libc",
    "litemap",
    "log",
    "memchr",
    "percent-encoding",
    "pin-project-lite",
    "portable-atomic",
    "portable-atomic-util",
    "potential_utf",
    "proc-macro2",
    "quick-xml",
    "quote",
