# cargo-deny configuration (design section 6.2). `cargo deny check` runs in the rust-lint job of ci.yml.

[graph]
# The targets of design section 6.4, so platform-specific dependencies (Windows, Android) are checked too.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-linux-android",
]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Not every licence in the list is in use today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# UniFFI (the bindings generator runtime, design section 6.2) is MPL-2.0, which is not on the general list above. MPL-2.0 is
# file-level copyleft: using the crates unmodified, as here, only obliges the notice in THIRD-PARTY-NOTICES.md and keeping
# the source of those files available (it is public on crates.io). Each exception names one crate that carries it.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi"
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_core"
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_internal_macros"
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_macros"
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_meta"
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_pipeline"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# The bindings generator's macros use two majors of `syn`; both run only while compiling, neither is linked into a library.
skip = [{ crate = "syn@2.0.119", reason = "uniffi_internal_macros uses syn 2 while uniffi_macros uses syn 3; build time only" }]

# The workspace crates, the connector crates (a git dependency), the external crates and everything they pull in, as `cargo metadata` reports them at this
# commit (all targets of design section 6.4). Anything else fails the check. Adding an external crate needs a decision
