# cargo-deny configuration (design section 6.2). `cargo deny check` runs in the rust-lint job of ci.yml.

[graph]
# The targets of design section 6.4, so platform-specific dependencies (Windows, Android) are checked too.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-linux-android",
]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Not every licence in the list is in use today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

# The workspace crates, the connector crates (a git dependency), the external crates and everything they pull in, as `cargo metadata` reports them at this
# commit (all targets of design section 6.4). Anything else fails the check. Adding an external crate needs a decision
# record (design section 6.2); scripts/ci/check-crate-architecture.py checks the direct dependencies of the workspace.
allow = [
    "async-trait",
    "base64",
    "block-buffer",
    "calendar-caldav",
    "calendar-core",
    "calendar-google",
    "calendar-ical",
    "calendar-ical-subscription",
