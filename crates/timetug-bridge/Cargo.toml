[package]
name = "timetug-bridge"
description = "Glue between TimeTugCore and the connector library (port of CalendarBridge)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
timetug-core = { workspace = true }
calendar-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# `rt` (spawn) and `sync` (channels) only; the clock rule forbids `tokio::time` outside tests.
tokio = { workspace = true }

[dev-dependencies]
jiff = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
