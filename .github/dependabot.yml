version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Cargo.toml pins every external crate exactly and cargo-deny gates licences and advisories; dependabot proposes the
  # bumps, which a reviewer takes together with deny.toml, the architecture script and THIRD-PARTY-NOTICES.md. The
  # calendar-connectors git dependency is moved by the bump workflow, not by dependabot.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
