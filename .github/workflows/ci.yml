# Continuous integration for the library (the Rust workspace). Runs on pull requests and on every push to main and v2.
# The job ids are the required status checks of the Protect main and Protect v2 rulesets; renaming one breaks every
# merge. scripts/ci/check-repository-contracts.py fails when one of them is missing.
#   macos, linux, windows-x64, windows-arm64
#                  the Rust workspace on each platform (the toolchain is pinned in rust-toolchain.toml): cargo test, a
#                  release build, a check that the C interface library has the file name the C# wrapper loads
#                  (TimeTugEngineC.dll, libTimeTugEngineC.dylib, libTimeTugEngineC.so), the C smoke test against that
#                  library (c-smoke/run.sh, scripts/ci/run-c-smoke.ps1: it compiles c-smoke/smoke.c against
#                  include/timetug_engine.h with the system C compiler and checks the four tt_engine_* exports), then
#                  the C concurrency harness (c-harness/harness.c: ordered and coalescing callbacks, destroy from
#                  inside and outside a callback, stale handles, many engines; c-harness/run.sh,
#                  scripts/ci/run-c-harness.ps1).
#   dotnet-windows-x64, dotnet-windows-arm64
#                  the managed wrapper and its tests (dotnet/TimeTug.Engine.Tests: golden fixtures, the conformance
#                  scenarios through the real DLL, lifecycle) on windows-latest and windows-11-arm: cargo build --release
#                  --locked -p timetug-engine-c --target <triple>, dotnet/pack/assemble-native.ps1 (the four exports,
#                  only Windows system DLLs as dependencies, no Visual C++ runtime), then the tests through
#                  scripts/ci/run-dotnet-tests.ps1 with a floor on the test count (scripts/ci/dotnet-test-floor.txt).
#   dotnet-rust-package
#                  packs the two native sets (exactly one native file per architecture, THIRD-PARTY-NOTICES.md beside the
#                  header), checks the package contents and applies the size gate (8 MB uncompressed per architecture).
#   dotnet-macos, dotnet-linux
#                  the same C# tests against libTimeTugEngineC.dylib and .so (extra coverage); dotnet-macos also builds the
#                  benchmark harness (dotnet/TimeTug.Engine.Bench, run by hand through bench.yml).
#   architecture   repository contracts and the tests of the CI scripts, the release script, the bump script and workflows.
#   compat         backward compatibility with the latest release (AGENTS.md, "Backward compatibility"), pull requests only:
#                  the baseline's fixtures and scenarios changed only by additions and its persisted-format fixtures
#                  unchanged (they moved from Tests/TimeTugEngineTests/Fixtures to fixtures/engine), the C header's
#                  declarations unchanged, the baseline's golden fixtures (re-encoded to a superset) and scenarios through
#                  the current code, and the baseline's tt_engine_* exports. Skipped with a notice for the label
#                  semver:major, and when no X.Y.Z tag exists. scripts/ci/compat/ holds the logic; its tests run in the
#                  architecture job.
#   compat-dotnet  the same rule for the managed wrapper: dotnet pack with package validation against the latest
#                  TimeTug.Engine on nuget.org (skipped for semver:major, and when nothing is published).
#   rust-lint      rustfmt, clippy, cargo-deny, the crate architecture, tokio feature and no-clock checks, and their tests.
#   rust-targets   release builds for x86_64-apple-darwin, aarch64-apple-ios and aarch64-apple-ios-sim.
# The labeled and unlabeled triggers re-run CI when a label changes, so adding or removing semver:major re-decides compat.
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  macos:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: The C interface library has its documented name
        run: test -f target/release/libTimeTugEngineC.dylib
      - name: C smoke test against the Rust library
        run: c-smoke/run.sh
      - name: C concurrency harness
        run: c-harness/run.sh

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: The C interface library has its documented name
        run: test -f target/release/libTimeTugEngineC.so
      - name: C smoke test against the Rust library
        run: c-smoke/run.sh
      - name: C concurrency harness
        run: c-harness/run.sh

  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: The C interface library has its documented name
        run: test -f target/release/TimeTugEngineC.dll
      - name: C smoke test against the Rust library
        shell: pwsh
        run: ./scripts/ci/run-c-smoke.ps1
      - name: C concurrency harness
        shell: pwsh
        run: ./scripts/ci/run-c-harness.ps1

  windows-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rustup when the image has none
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: The C interface library has its documented name
        run: test -f target/release/TimeTugEngineC.dll
      - name: C smoke test against the Rust library
        shell: pwsh
        run: ./scripts/ci/run-c-smoke.ps1
      - name: C concurrency harness
        shell: pwsh
        run: ./scripts/ci/run-c-harness.ps1

  dotnet-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build the Rust engine library
        shell: pwsh
        run: |
          cargo build --release --locked -p timetug-engine-c --target x86_64-pc-windows-msvc
          exit $LASTEXITCODE
      - name: Assemble the native set (the exports and the dependencies are checked)
        shell: pwsh
        run: ./dotnet/pack/assemble-native.ps1 -Rid win-x64 -Out build/native/win-x64
      - name: C# tests against the Rust library
        shell: pwsh
        run: ./scripts/ci/run-dotnet-tests.ps1 -NativeDir build/native/win-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-win-x64
          path: build/native/win-x64
          if-no-files-found: error

  dotnet-windows-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rustup when the image has none
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build the Rust engine library
        shell: pwsh
        run: |
          cargo build --release --locked -p timetug-engine-c --target aarch64-pc-windows-msvc
          exit $LASTEXITCODE
      - name: Assemble the native set (the exports and the dependencies are checked)
        shell: pwsh
        run: ./dotnet/pack/assemble-native.ps1 -Rid win-arm64 -Out build/native/win-arm64
      - name: C# tests against the Rust library
        shell: pwsh
        run: ./scripts/ci/run-dotnet-tests.ps1 -NativeDir build/native/win-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-win-arm64
          path: build/native/win-arm64
          if-no-files-found: error

  # The package the library ships in: exactly one native file per architecture, the notices beside the header, and
  # the 8 MB size gate (dotnet/pack/measure-size.ps1 exits 1 above 8,388,608 bytes uncompressed per architecture).
  dotnet-rust-package:
    needs: [dotnet-windows-x64, dotnet-windows-arm64]
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win-x64
          path: build/native/win-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win-arm64
          path: build/native/win-arm64
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Pack
        shell: pwsh
        run: |
          dotnet pack dotnet/TimeTug.Engine -c Release -o build/nupkg "-p:Version=0.0.0-ci" `
            "-p:NativeWinX64Dir=$PWD/build/native/win-x64" "-p:NativeWinArm64Dir=$PWD/build/native/win-arm64" `
            -p:RequireNativeAssets=true
          exit $LASTEXITCODE
      - name: Check the package contents
        shell: pwsh
        run: |
          python scripts/ci/tests/test_pack_inventory.py build/nupkg/TimeTug.Engine.0.0.0-ci.nupkg --version 0.0.0-ci
          exit $LASTEXITCODE
      - name: Size gate
        shell: pwsh
        run: ./dotnet/pack/measure-size.ps1 -NativeRoot build/native -Package build/nupkg/TimeTug.Engine.0.0.0-ci.nupkg

  dotnet-macos:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build the engine library
        run: cargo build --release --locked -p timetug-engine-c
      - name: Build the benchmark harness
        run: dotnet build dotnet/TimeTug.Engine.Bench -c Release
      - name: C# tests
        run: |
          set -euo pipefail
          export TIMETUG_ENGINE_LIBRARY="$PWD/target/release/libTimeTugEngineC.dylib"
          dotnet test dotnet/TimeTug.Engine.Tests -c Release --logger 'console;verbosity=normal' 2>&1 | tee dotnet-test.log
          python3 scripts/ci/count-dotnet-tests.py dotnet-test.log --floor-file scripts/ci/dotnet-test-floor.txt

  dotnet-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build the engine library
        run: cargo build --release --locked -p timetug-engine-c
      - name: C# tests
        run: |
          set -euo pipefail
          export TIMETUG_ENGINE_LIBRARY="$PWD/target/release/libTimeTugEngineC.so"
          dotnet test dotnet/TimeTug.Engine.Tests -c Release --logger 'console;verbosity=normal' 2>&1 | tee dotnet-test.log
          python3 scripts/ci/count-dotnet-tests.py dotnet-test.log --floor-file scripts/ci/dotnet-test-floor.txt

  architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned test prerequisites
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install -r scripts/ci/requirements-test.txt
      - name: Repository contracts
        run: build/venv/bin/python scripts/ci/check-repository-contracts.py
      - name: Tests of the checks, of the release script and of the bump workflow
        run: |
          scripts/release/tests/test-next-version.sh
          PYTHON="$PWD/build/venv/bin/python" scripts/release/tests/test-release-version-step.sh
          # The steps of bump-dependencies.yml, run against the real bump-cargo-dependency.py and stub git and gh.
          PYTHON="$PWD/build/venv/bin/python" scripts/ci/tests/test-bump-workflow-step.sh
          # Includes test_bump_cargo_dependency.py (the Cargo.toml editor) and the contracts tests.
          build/venv/bin/python -m unittest discover -s scripts/ci/tests -p 'test_*.py'

  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The baseline is a release tag: the history and the tags are needed.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the checks apply
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/compat/compat.py gate --base-ref "origin/${BASE_REF:-main}"
      # Each check below runs even when an earlier one failed, so one run reports every broken category.
      # Golden fixtures and scenarios may only gain fields (scenarios also entries at the end of a list); the
      # persisted-data fixtures model files on users' disks and never change. Deleting any of them fails. The
      # persisted-data fixtures moved from Tests/TimeTugEngineTests/Fixtures (the 1.x layout) to fixtures/engine: a
      # baseline file must exist unchanged at either path (OLD=NEW).
      - name: Files that exist in the baseline are intact (fixtures, scenarios, persisted formats)
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: |
          python3 scripts/ci/compat/compat.py frozen "$BASELINE" \
            --additive Conformance/Fixtures/golden --appendable Conformance/Scenarios \
            --strict Tests/TimeTugEngineTests/Fixtures=fixtures/engine fixtures/engine
      - name: C header declarations
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: python3 scripts/ci/compat/compat.py header "$BASELINE" include/timetug_engine.h
      - name: Install the pinned Rust toolchain
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: rustup show active-toolchain || rustup toolchain install
      - name: Export the baseline's golden fixtures and scenarios
        id: baseline
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: scripts/ci/compat/export-baseline.sh "$BASELINE" build/compat-baseline
      - name: The baseline's golden fixtures through the current code
        if: ${{ !cancelled() && steps.baseline.conclusion == 'success' }}
        env:
          TT_BASELINE_FIXTURES: ${{ github.workspace }}/build/compat-baseline/golden
        run: |
          set -euo pipefail
          cargo test --locked -p timetug-engine-protocol fixture 2>&1 | tee build/compat-fixtures.log
          # A filter that matched nothing must not pass.
          python3 scripts/ci/compat/compat.py ran build/compat-fixtures.log 20
      - name: The baseline's scenarios through the current library
        if: ${{ !cancelled() && steps.baseline.conclusion == 'success' }}
        env:
          TT_BASELINE_SCENARIOS: ${{ github.workspace }}/build/compat-baseline/scenarios
        run: |
          set -euo pipefail
          cargo test --release --locked -p timetug-engine-c --test scenarios 2>&1 | tee build/compat-scenarios.log
          python3 scripts/ci/compat/compat.py ran build/compat-scenarios.log 3
      - name: The library still exports the baseline's C functions
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p timetug-engine-c
          python3 scripts/ci/compat/compat.py exports "$BASELINE" include/timetug_engine.h target/release/libTimeTugEngineC.so

  compat-dotnet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the checks apply
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/compat/compat.py gate --base-ref "origin/${BASE_REF:-main}"
      - name: Find the published baseline package
        id: nuget
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/ci/compat/compat.py nuget-baseline
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.nuget.outputs.version != ''
        with:
          dotnet-version: 8.0.x
      # Only the managed assembly is compared, so the package is packed without the native sets. Its version is the
      # baseline's: package validation also requires an assembly version at least the baseline's.
      - name: Pack with package validation against the published baseline
        if: steps.nuget.outputs.version != ''
        env:
          VERSION: ${{ steps.nuget.outputs.version }}
        run: |
          dotnet pack dotnet/TimeTug.Engine -c Release -o build/nupkg-compat \
            "-p:Version=$VERSION" "-p:TimeTugPackageValidationBaseline=$VERSION"

  rust-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      # Local overrides of the connector crates live in the git-ignored .cargo/config.local.toml
      # (scripts/dev/use-local-connectors.sh); no tracked cargo config may patch them.
      - name: No tracked cargo config patches the connector crates
        run: |
          if git grep -nE '^[[:space:]]*\[patch' -- '.cargo/config.toml' '.cargo/config' '.cargo/config.local.toml'; then
            echo "::error::a tracked cargo config contains a [patch] section; use scripts/dev/use-local-connectors.sh"
            exit 1
          fi
          if git ls-files --error-unmatch .cargo/config.local.toml > /dev/null 2>&1; then
            echo "::error::.cargo/config.local.toml is tracked"
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Keep the version equal to the one in AGENTS.md ("On v2: Rust").
      - name: Cache cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1
      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Licences, bans and advisories
        run: cargo deny check
      - name: Crate architecture and tokio features
        run: |
          python3 scripts/ci/check-crate-architecture.py
          python3 scripts/ci/check-tokio-features.py
          python3 scripts/ci/check-bindings-surface.py
      - name: The pure crates and the engine read no clock and no environment (SystemClock excepted)
        run: python3 scripts/ci/check-no-clock.py
      - name: Every test of the Swift baseline has a Rust counterpart
        run: python3 scripts/ci/check-test-parity.py --require-complete TimeTugCoreTests --require-complete CalendarBridgeTests --require-complete TimeTugEngineTests --require-complete TimeTugEngineProtocolTests --require-complete TimeTugEngineCTests
      - name: Third-party notices list every crate of the library's dependency tree
        run: python3 scripts/ci/check-third-party-notices.py
      - name: Tests of the Rust checks and of the local-override script
        run: |
          python3 -m unittest discover -s scripts/ci/tests -p 'test_check_crate_architecture.py'
          python3 -m unittest discover -s scripts/ci/tests -p 'test_check_tokio_features.py'
          python3 -m unittest discover -s scripts/ci/tests -p 'test_check_no_clock.py'
          python3 -m unittest discover -s scripts/ci/tests -p 'test_check_bindings_surface.py'
          python3 -m unittest discover -s scripts/ci/tests -p 'test_check_test_parity.py'
          python3 -m unittest discover -s scripts/ci/tests -p 'test_check_third_party_notices.py'
          python3 -m unittest discover -s scripts/ci/tests -p 'test_use_local_connectors.py'

  rust-targets:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build for the other Apple targets
        run: |
          for target in x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo build --workspace --release --locked --target "$target"
          done
