# Continuous integration for the library. Runs on pull requests and on every push to main.
# The job ids are the required status checks of the Protect main ruleset; renaming one breaks every merge.
#   macos          swift test on the whole package, then the C smoke test (c-smoke/run.sh).
#   linux          swift test in the swift:6.0 container: proves the library stays portable; then the C smoke test.
#   windows-x64    swift test on windows-latest with Swift installed by scripts/ci/install-swift-windows.ps1, then
#                  the C smoke test (scripts/ci/run-c-smoke.ps1).
#   windows-arm64  the same on windows-11-arm.
# The C smoke test builds the TimeTugEngineC library, compiles c-smoke/smoke.c against include/timetug_engine.h
# with the system C compiler and runs it; on macOS and Linux it first checks that the library exports the four
# tt_engine_* functions.
#   dotnet-windows-x64, dotnet-windows-arm64
#                  the managed wrapper and its tests (dotnet/TimeTug.Engine.Tests: golden fixtures, the conformance
#                  scenarios through the real DLL, lifecycle) on windows-latest and windows-11-arm: build the DLL,
#                  assemble it with its Swift runtime closure and check its exports (dotnet/pack/assemble-native.ps1),
#                  then run the tests with the Swift runtime removed from the PATH (scripts/ci/run-dotnet-tests.ps1),
#                  with a floor on the test count (scripts/ci/dotnet-test-floor.txt).
#   dotnet-macos, dotnet-linux
#                  the same C# tests against libTimeTugEngineC.dylib and .so (extra coverage).
#   architecture   portability rules, repository contracts and the tests of the release script, the bump script and workflows.
#   compat         backward compatibility with the latest release (AGENTS.md, "Backward compatibility"), pull requests only:
#                  the baseline's fixtures and scenarios changed only by additions and its persisted-format fixtures
#                  unchanged, the C header's declarations unchanged, the Swift public API of every library product
#                  (swift package diagnose-api-breaking-changes), the baseline's golden fixtures (re-encoded to a
#                  superset) and scenarios through the current code, and the baseline's tt_engine_* exports. Skipped
#                  with a notice for the label semver:major, and when no X.Y.Z tag exists. scripts/ci/compat/ holds
#                  the logic; its tests run in the architecture job.
#   compat-dotnet  the same rule for the managed wrapper: dotnet pack with package validation against the latest
#                  TimeTug.Engine on nuget.org (skipped for semver:major, and when nothing is published).
# The labeled and unlabeled triggers re-run CI when a label changes, so adding or removing semver:major re-decides compat.
# Every swift test runs with --force-resolved-versions, so a Package.resolved that no longer matches
# Package.swift fails here instead of being silently re-resolved.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  macos:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select newest Xcode
        run: scripts/ci/select-xcode.sh
      - name: Test
        run: swift test --force-resolved-versions
      - name: C smoke test
        run: c-smoke/run.sh

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          for attempt in 1 2 3; do
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "::warning::Docker Hub login failed; pulling anonymously."
      - name: Pull the Swift image
        run: |
          for attempt in 1 2 3; do
            docker pull swift:6.0 && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work swift:6.0 swift test --force-resolved-versions
      - name: C smoke test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work swift:6.0 c-smoke/run.sh

  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Swift
        shell: pwsh
        run: ./scripts/ci/install-swift-windows.ps1
      - name: Test
        shell: pwsh
        run: |
          # PowerShell does not stop at a failing native command, and a later native command
          # overwrites $LASTEXITCODE (a failing swift test followed by git made a step pass in the
          # bring-up probe). So the exit code is read on the very next statement, and the step can
          # only succeed when swift test exited 0 AND the log shows enough executed tests.
          # Floor: Core 301 + Bridge 13 + Engine 152 + Protocol 59 + C interface 34 = 559 Swift Testing tests on macOS
          # (a parameterized test, such as the one that runs every conformance scenario, counts once); 499 is about
          # 90 % of that, so a silently skipped target or a zero turns the job red while normal growth needs no edit.
          # --minimum-runs 5 is one summary per test target (TimeTugCoreTests, CalendarBridgeTests, TimeTugEngineTests,
          # TimeTugEngineProtocolTests, TimeTugEngineCTests): it also catches a vanished Bridge, whose 13 tests alone
          # would not move the total below the floor.
          # --minimum-per-run 1 makes every summary report at least one test: a target that still
          # builds but holds no tests prints `Test run with 0 tests ... passed`, which the total and
          # the run count alone accept (the 301 of Core is above the floor).
          # Raise the floor and the run count when targets or tests are added.
          $PSNativeCommandUseErrorActionPreference = $true
          swift test --force-resolved-versions 2>&1 | Tee-Object -FilePath test.log
          $swiftExit = $LASTEXITCODE
          # With the native-command preference above PowerShell normally throws first; this explicit
          # check is the guard that does not depend on that preference.
          if ($swiftExit -ne 0) {
            Write-Host "::error::swift test exited with code $swiftExit"
            exit $swiftExit
          }
          python --version
          python scripts/ci/count-swift-tests.py test.log --minimum 499 --minimum-runs 5 --minimum-per-run 1
          exit $LASTEXITCODE
      - name: C smoke test
        shell: pwsh
        run: ./scripts/ci/run-c-smoke.ps1

  windows-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Swift
        shell: pwsh
        run: ./scripts/ci/install-swift-windows.ps1
      - name: Test
        shell: pwsh
        run: |
          # Same step as windows-x64; see the comments there for the exit code handling and the floor.
          $PSNativeCommandUseErrorActionPreference = $true
          swift test --force-resolved-versions 2>&1 | Tee-Object -FilePath test.log
          $swiftExit = $LASTEXITCODE
          # With the native-command preference above PowerShell normally throws first; this explicit
          # check is the guard that does not depend on that preference.
          if ($swiftExit -ne 0) {
            Write-Host "::error::swift test exited with code $swiftExit"
            exit $swiftExit
          }
          python --version
          python scripts/ci/count-swift-tests.py test.log --minimum 499 --minimum-runs 5 --minimum-per-run 1
          exit $LASTEXITCODE
      - name: C smoke test
        shell: pwsh
        run: ./scripts/ci/run-c-smoke.ps1

  dotnet-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Swift
        shell: pwsh
        run: ./scripts/ci/install-swift-windows.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build the engine library
        shell: pwsh
        run: |
          swift build -c release --product TimeTugEngineC
          exit $LASTEXITCODE
      - name: Assemble the native set and check its exports
        shell: pwsh
        run: ./dotnet/pack/assemble-native.ps1 -Rid win-x64 -Out build/native/win-x64
      - name: C# tests
        shell: pwsh
        run: ./scripts/ci/run-dotnet-tests.ps1 -NativeDir build/native/win-x64

  dotnet-windows-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Swift
        shell: pwsh
        run: ./scripts/ci/install-swift-windows.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build the engine library
        shell: pwsh
        run: |
          swift build -c release --product TimeTugEngineC
          exit $LASTEXITCODE
      - name: Assemble the native set and check its exports
        shell: pwsh
        run: ./dotnet/pack/assemble-native.ps1 -Rid win-arm64 -Out build/native/win-arm64
      - name: C# tests
        shell: pwsh
        run: ./scripts/ci/run-dotnet-tests.ps1 -NativeDir build/native/win-arm64

  dotnet-macos:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select newest Xcode
        run: scripts/ci/select-xcode.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build the engine library
        run: swift build -c release --product TimeTugEngineC
      - name: C# tests
        run: |
          set -euo pipefail
          export TIMETUG_ENGINE_LIBRARY="$(swift build -c release --show-bin-path)/libTimeTugEngineC.dylib"
          dotnet test dotnet/TimeTug.Engine.Tests -c Release --logger 'console;verbosity=normal' 2>&1 | tee dotnet-test.log
          python3 scripts/ci/count-swift-tests.py dotnet-test.log --dotnet-floor-file scripts/ci/dotnet-test-floor.txt

  dotnet-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          for attempt in 1 2 3; do
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "::warning::Docker Hub login failed; pulling anonymously."
      - name: Pull the Swift image
        run: |
          for attempt in 1 2 3; do
            docker pull swift:6.0 && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      # The library is built in the swift:6.0 container; its Swift runtime is copied out beside it, and the tests run
      # on the runner (a newer glibc than the image's, which runs what the image built).
      - name: Build the engine library
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work swift:6.0 bash -c '
            set -euo pipefail
            swift build -c release --product TimeTugEngineC
            mkdir -p build/native/linux
            cp "$(swift build -c release --show-bin-path)/libTimeTugEngineC.so" build/native/linux/
            cp -L /usr/lib/swift/linux/*.so build/native/linux/'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: C# tests
        run: |
          set -euo pipefail
          export TIMETUG_ENGINE_LIBRARY="$PWD/build/native/linux/libTimeTugEngineC.so"
          export LD_LIBRARY_PATH="$PWD/build/native/linux"
          dotnet test dotnet/TimeTug.Engine.Tests -c Release --logger 'console;verbosity=normal' 2>&1 | tee dotnet-test.log
          python3 scripts/ci/count-swift-tests.py dotnet-test.log --dotnet-floor-file scripts/ci/dotnet-test-floor.txt

  architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned test prerequisites
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install -r scripts/ci/requirements-test.txt
      - name: Architecture rules
        run: scripts/ci/check-architecture.sh
      - name: Repository contracts
        run: build/venv/bin/python scripts/ci/check-repository-contracts.py
      - name: Tests of the checks, of the release script and of the bump workflow
        run: |
          scripts/ci/tests/test-check-architecture.sh
          scripts/release/tests/test-next-version.sh
          PYTHON="$PWD/build/venv/bin/python" scripts/release/tests/test-release-version-step.sh
          # The steps of bump-dependencies.yml, run against the real bump-resolved.py and Package.resolved.
          PYTHON="$PWD/build/venv/bin/python" scripts/ci/tests/test-bump-workflow-step.sh
          # Includes test_bump_resolved.py (the Package.resolved editor) and the contracts tests.
          build/venv/bin/python -m unittest discover -s scripts/ci/tests -p 'test_*.py'

  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The baseline is a release tag; diagnose-api-breaking-changes checks it out from this clone.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the checks apply
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/compat/compat.py gate --base-ref "origin/${BASE_REF:-main}"
      # Each check below runs even when an earlier one failed, so one run reports every broken category.
      # Golden fixtures and scenarios may only gain fields (scenarios also entries at the end of a list); the
      # persisted-data fixtures model files on users' disks and never change. Deleting any of them fails.
      - name: Files that exist in the baseline are intact (fixtures, scenarios, persisted formats)
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: |
          python3 scripts/ci/compat/compat.py frozen "$BASELINE" \
            --additive Conformance/Fixtures/golden --appendable Conformance/Scenarios \
            --strict Tests/TimeTugEngineTests/Fixtures
      - name: C header declarations
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: python3 scripts/ci/compat/compat.py header "$BASELINE" include/timetug_engine.h
      - name: Log in to Docker Hub
        if: steps.gate.outputs.run == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          for attempt in 1 2 3; do
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "::warning::Docker Hub login failed; pulling anonymously."
      - name: Pull the Swift image
        if: steps.gate.outputs.run == 'true'
        run: |
          for attempt in 1 2 3; do
            docker pull swift:6.0 && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Swift public API of every library product
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e BASELINE -v "$PWD:/work" -w /work swift:6.0 bash -c '
            set -euo pipefail
            git config --global --add safe.directory /work
            swift package --force-resolved-versions diagnose-api-breaking-changes "$BASELINE" \
              --products TimeTugCore CalendarBridge TimeTugEngine TimeTugEngineProtocol TimeTugEngineC'
      - name: The baseline's golden fixtures and scenarios through the current code
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: |
          set -euo pipefail
          scripts/ci/compat/export-baseline.sh "$BASELINE" build/compat-baseline
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
            -e TT_BASELINE_FIXTURES=/work/build/compat-baseline/golden \
            -e TT_BASELINE_SCENARIOS=/work/build/compat-baseline/scenarios \
            swift:6.0 swift test --force-resolved-versions --filter FixtureTests --filter ScenarioTests 2>&1 | tee build/compat-test.log
          # A filter that matched nothing must not pass: both suites must have run (on Linux every target reports in
          # one summary, so the count of summaries cannot show it).
          python3 scripts/ci/count-swift-tests.py build/compat-test.log --minimum 20
          for suite in FixtureTests ScenarioTests; do
            grep -q "Suite $suite passed" build/compat-test.log || { echo "::error::$suite did not run"; exit 1; }
          done
      - name: The library still exports the baseline's C functions
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work swift:6.0 \
            swift build --force-resolved-versions --product TimeTugEngineC
          python3 scripts/ci/compat/compat.py exports "$BASELINE" include/timetug_engine.h .build/debug/libTimeTugEngineC.so

  compat-dotnet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the checks apply
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/compat/compat.py gate --base-ref "origin/${BASE_REF:-main}"
      - name: Find the published baseline package
        id: nuget
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/ci/compat/compat.py nuget-baseline
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.nuget.outputs.version != ''
        with:
          dotnet-version: 8.0.x
      # Only the managed assembly is compared, so the package is packed without the native sets. Its version is the
      # baseline's: package validation also requires an assembly version at least the baseline's.
      - name: Pack with package validation against the published baseline
        if: steps.nuget.outputs.version != ''
        env:
          VERSION: ${{ steps.nuget.outputs.version }}
        run: |
          dotnet pack dotnet/TimeTug.Engine -c Release -o build/nupkg-compat \
            "-p:Version=$VERSION" "-p:TimeTugPackageValidationBaseline=$VERSION"
