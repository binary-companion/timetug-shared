# Resource baselines of the engine (docs/rust-port/baselines.md): time to ready, working set, private bytes, idle CPU
# and native module size, measured by dotnet/TimeTug.Engine.Bench against the Swift engine library (input engine=swift, the
# default) or the Rust one (engine=rust), three runs per platform on fresh runners. Run by hand; each run uploads its JSON as an artifact (bench-<platform>-<run>). Not part of CI.
name: Engine benchmark

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which runners to measure on
        type: choice
        options: [all, windows-x64, windows-arm64, macos-arm64]
        default: all
      engine:
        description: Which engine library to measure
        type: choice
        options: [swift, rust]
        default: swift
      idle-seconds:
        description: Seconds the started engine idles before memory and CPU are read
        type: string
        default: '600'

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all_targets = [
              {"platform": "windows-x64", "os": "windows-latest"},
              {"platform": "windows-arm64", "os": "windows-11-arm"},
              {"platform": "macos-arm64", "os": "macos-26"},
          ]
          chosen = os.environ["PLATFORM"]
          include = [dict(t, run=r) for t in all_targets if chosen in ("all", t["platform"]) for r in (1, 2, 3)]
          print("matrix=" + json.dumps({"include": include}))
          PY

  bench:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rustup when the image has none
        if: inputs.engine == 'rust' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install the pinned Rust toolchain
        if: inputs.engine == 'rust'
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Swift
        if: inputs.engine != 'rust' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-swift-windows.ps1
      - name: Select newest Xcode
        if: inputs.engine != 'rust' && runner.os == 'macOS'
        run: scripts/ci/select-xcode.sh
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Describe the machine
        shell: pwsh
        run: |
          [pscustomobject]@{
            runner = $env:RUNNER_NAME; image = $env:ImageOS; imageVersion = $env:ImageVersion
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            logicalCpus = [Environment]::ProcessorCount
          } | ConvertTo-Json | Tee-Object -FilePath machine.json
      - name: Measure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IDLE_SECONDS: ${{ inputs.idle-seconds }}
          ENGINE: ${{ inputs.engine }}
        run: |
          $extra = @{}
          if ($env:ENGINE -eq 'rust') { $extra.Rust = $true }
          ./scripts/benchmarks/run-engine-bench.ps1 -IdleSeconds ([int]$env:IDLE_SECONDS) -Out build/bench/engine-bench.json @extra
          exit $LASTEXITCODE
      - name: Measure (macOS)
        if: runner.os == 'macOS'
        env:
          IDLE_SECONDS: ${{ inputs.idle-seconds }}
          ENGINE: ${{ inputs.engine }}
        run: |
          extra=""
          if [ "$ENGINE" = rust ]; then extra="--rust"; fi
          scripts/benchmarks/run-engine-bench.sh --idle-seconds "$IDLE_SECONDS" --out build/bench/engine-bench.json $extra
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-${{ inputs.engine }}-${{ matrix.platform }}-${{ matrix.run }}
          path: |
            build/bench/engine-bench.json
            machine.json
          if-no-files-found: error
