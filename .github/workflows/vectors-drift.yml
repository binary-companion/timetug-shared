# Weekly check that the golden vectors under vectors/ still equal what the Swift code produces on the current runner image.
# The same steps as the vectors-current job of ci.yml, but on a schedule, so a new Xcode, macOS image or Swift toolchain
# that changes a zone rule or Foundation's URL parsing shows up without waiting for a pull request.
# A failed scheduled run opens one issue (unless one is already open). Scheduled workflows only run from the default
# branch; workflow_dispatch starts the check by hand from any branch.
name: Vectors drift

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  vectors-drift:
    runs-on: macos-26
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select newest Xcode
        run: scripts/ci/select-xcode.sh
      - name: Export the vectors
        run: scripts/dev/export-vectors.sh
      - name: The committed vectors are current
        run: |
          git status --short vectors/
          git diff --exit-code vectors/
          test -z "$(git ls-files --others --exclude-standard vectors/)"
      - name: Open an issue when the vectors drifted
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='vectors drifted on the runner'
          if [ -n "$(gh issue list --state open --search "$title in:title" --json title --jq ".[] | select(.title == \"$title\") | .title")" ]; then
            echo "An open issue already exists."
            exit 0
          fi
          gh issue create --title "$title" --body "The weekly vectors check failed: $RUN_URL

          Follow 'When to re-check the vectors' in vectors/README.md. Inspect the diff, never accept it blindly."
