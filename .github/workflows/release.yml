# Releases timetug-shared. Every push to main publishes the next X.Y.Z tag and a GitHub release.
# The bump comes from the semver:* labels of the merged pull requests since the latest tag (patch
# by default; the highest wins, so a replaced pending run cannot lose a major). Nothing is released
# while the repository has no X.Y.Z tag (the first version is dispatched by hand), nor when the
# pushed commit already carries one (a re-run).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to publish. Needed for the first release and for recovery."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The latest version is the highest strict X.Y.Z tag REACHABLE from the pushed commit, so a
          # hand-made tag on a side branch cannot over- or under-bump this release.
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --merged "$SHA" --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$OVERRIDE" ]; then
            tagged="$(git tag --points-at "$SHA" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            if [ -n "$tagged" ]; then
              echo "::notice::$SHA already carries $tagged; nothing to release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # The labels of every commit since the latest tag, not only of the pushed one: a pending
          # run that a newer push replaced must not lose its semver:major. A failed API call fails
          # the step, so a missing label never turns into a patch release.
          labels=""
          if [ -z "$OVERRIDE" ] && [ -n "$latest" ]; then
            commits="$(git rev-list "$latest..$SHA")"
            while IFS= read -r commit; do
              [ -n "$commit" ] || continue
              found="$(gh api "repos/$REPO/commits/$commit/pulls" --jq '[.[].labels[].name] | join(",")' </dev/null)"
              if [ -n "$found" ]; then labels="${labels:+$labels,}$found"; fi
            done <<< "$commits"
          fi
          status=0
          version="$(scripts/release/next-version.sh --latest "$latest" --labels "$labels" --override "$OVERRIDE")" || status=$?
          case "$status" in
            0) echo "version=$version" >> "$GITHUB_OUTPUT"
               echo "Releasing $version (latest: ${latest:-none}; labels: ${labels:-none})" ;;
            3) echo "::notice::No X.Y.Z tag exists yet; nothing is released until the first version is dispatched by hand."
               echo "version=" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Create the tag and the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes
      - name: Record the connector version in the release notes
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cc="$(python3 scripts/ci/resolved-version.py Package.resolved calendar-connectors)"
          body="$(gh release view "$VERSION" --json body --jq .body)"
          printf '%s\n\nBuilt and tested with calendar-connectors %s.\n' "$body" "$cc" > "$RUNNER_TEMP/notes.md"
          gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # Tells each dependent that a version exists, so its own workflow can open a bump pull request.
  # Skipped when nothing was released. The token comes from the timetug-bot GitHub App, installed on
  # timetug only; the bump environment holds its credentials and is limited to main.
  notify:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    environment: bump
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          # app-id is deprecated upstream in favour of client-id, which needs the app's Client ID;
          # switch once that value is available. It still works.
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: timetug
          # Only what repository_dispatch needs: the app is installed with more, the token is not.
          permission-contents: write
      - name: Tell the dependents
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          for dependent in timetug; do
            gh api "repos/binary-companion/$dependent/dispatches" \
              -f event_type=library-released \
              -f "client_payload[library]=timetug-shared" \
              -f "client_payload[version]=$VERSION"
          done
