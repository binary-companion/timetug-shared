# Releases timetug-shared. Every push to main publishes the next X.Y.Z tag and a GitHub release.
# The bump comes from the semver:* labels of the merged pull requests since the latest tag (patch
# by default; the highest wins, so a replaced pending run cannot lose a major). Nothing is released
# while the repository has no X.Y.Z tag (the first version is dispatched by hand), nor when the
# pushed commit already carries one (a re-run).
#
# Every release also builds the TimeTug.Engine NuGet package with the same version (nuget-version, nuget-native on
# windows-latest and windows-11-arm, nuget-pack) and pushes it to nuget.org with trusted publishing (publish-nuget,
# environment publish, no stored key). publish-nuget only reports a notice while the repository variable NUGET_USER
# (the nuget.org account of the trusted-publishing policy) is unset; the package is still built, tested and
# uploaded as a workflow artifact. A dispatch with publish: false is a dry run on any branch: no tag, no release,
# no notification and no push, only the package (version: the version input, or 0.0.0-dryrun.<run number>).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to publish. Needed for the first release and for recovery. A version lower than the latest tag is refused; the latest tag itself recovers its missing release."
        required: false
        type: string
      publish:
        description: "Publish (tag, release, notify, push the package). False: a dry run that only builds, tests and uploads the NuGet package, on any branch."
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The latest version is the highest strict X.Y.Z tag REACHABLE from the pushed commit, so a
          # hand-made tag on a side branch cannot over- or under-bump this release.
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --merged "$SHA" --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$OVERRIDE" ]; then
            tagged="$(git tag --points-at "$SHA" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            if [ -n "$tagged" ]; then
              echo "::notice::$SHA already carries $tagged; nothing to release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # The labels of every commit since the latest tag, not only of the pushed one: a pending
          # run that a newer push replaced must not lose its semver:major. A failed API call fails
          # the step, so a missing label never turns into a patch release.
          labels=""
          if [ -z "$OVERRIDE" ] && [ -n "$latest" ]; then
            commits="$(git rev-list "$latest..$SHA")"
            while IFS= read -r commit; do
              [ -n "$commit" ] || continue
              found="$(gh api "repos/$REPO/commits/$commit/pulls" --jq '[.[].labels[].name] | join(",")' </dev/null)"
              if [ -n "$found" ]; then labels="${labels:+$labels,}$found"; fi
            done <<< "$commits"
          fi
          status=0
          version="$(scripts/release/next-version.sh --latest "$latest" --labels "$labels" --override "$OVERRIDE")" || status=$?
          case "$status" in
            0) echo "version=$version" >> "$GITHUB_OUTPUT"
               echo "Releasing $version (latest: ${latest:-none}; labels: ${labels:-none})" ;;
            3) echo "::notice::No X.Y.Z tag exists yet; nothing is released until the first version is dispatched by hand."
               echo "version=" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Create the tag and the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes
      # The release exists at this point and a re-run would find it already tagged and release nothing,
      # so a failure here must not skip `notify`: the notes are an addition, the dispatch is the contract.
      - name: Record the connector version in the release notes
        if: steps.version.outputs.version != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cc="$(python3 scripts/ci/resolved-version.py Package.resolved calendar-connectors)"
          body="$(gh release view "$VERSION" --json body --jq .body)"
          printf '%s\n\nBuilt and tested with calendar-connectors %s.\n' "$body" "$cc" > "$RUNNER_TEMP/notes.md"
          gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # Tells each dependent that a version exists, so its own workflow can open a bump pull request.
  # Skipped when nothing was released. The token comes from the timetug-bot GitHub App, installed on
  # timetug and timetug-shared; the bump environment holds its credentials and is limited to main.
  notify:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    environment: bump
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          # app-id is deprecated upstream in favour of client-id, which needs the app's Client ID;
          # switch once that value is available. It still works.
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: timetug
          # Only what repository_dispatch needs: the app is installed with more, the token is not.
          permission-contents: write
      - name: Tell the dependents
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          for dependent in timetug; do
            gh api "repos/binary-companion/$dependent/dispatches" \
              -f event_type=library-released \
              -f "client_payload[library]=timetug-shared" \
              -f "client_payload[version]=$VERSION"
          done

  # The package version: the released tag, or for a dry run the version input or 0.0.0-dryrun.<run number>.
  nuget-version:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.outputs.version != '' || (github.event_name == 'workflow_dispatch' && !inputs.publish)) }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Choose the package version
        id: version
        env:
          RELEASED: ${{ needs.publish.outputs.version }}
          REQUESTED: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="${RELEASED:-${REQUESTED:-0.0.0-dryrun.$RUN_NUMBER}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a package version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version $version"

  # The native set per architecture, built on its own runner with the version stamped in, and tested there.
  nuget-native:
    needs: nuget-version
    if: ${{ !cancelled() && needs.nuget-version.result == 'success' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.nuget-version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Swift
        shell: pwsh
        run: ./scripts/ci/install-swift-windows.ps1
      - name: Stamp the version into the engine
        shell: pwsh
        run: |
          python scripts/release/stamp-engine-version.py $env:VERSION
          exit $LASTEXITCODE
      - name: Build the engine library
        shell: pwsh
        run: |
          swift build -c release --product TimeTugEngineC
          exit $LASTEXITCODE
      - name: Assemble the native set and check its exports
        shell: pwsh
        run: ./dotnet/pack/assemble-native.ps1 -Rid $env:RID -Out "build/native/$env:RID"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: C# tests against the native set
        shell: pwsh
        env:
          TIMETUG_EXPECTED_ENGINE_VERSION: ${{ needs.nuget-version.outputs.version }}
        run: ./scripts/ci/run-dotnet-tests.ps1 -NativeDir "build/native/$env:RID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.rid }}
          path: build/native/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7

  # One package with both native sets. Its C# tests run on a runner with no Swift toolchain at all, so they also
  # prove the x64 set is complete. The package is checked and measured, then uploaded whether or not it is pushed.
  nuget-pack:
    needs: [nuget-version, nuget-native]
    if: ${{ !cancelled() && needs.nuget-native.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.nuget-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win-x64
          path: build/native/win-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win-arm64
          path: build/native/win-arm64
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: C# tests on this architecture
        shell: pwsh
        env:
          TIMETUG_EXPECTED_ENGINE_VERSION: ${{ needs.nuget-version.outputs.version }}
        run: ./scripts/ci/run-dotnet-tests.ps1 -NativeDir build/native/win-x64
      - name: Pack
        shell: pwsh
        run: |
          dotnet pack dotnet/TimeTug.Engine -c Release -o build/nupkg "-p:Version=$env:VERSION" `
            "-p:NativeWinX64Dir=$PWD/build/native/win-x64" "-p:NativeWinArm64Dir=$PWD/build/native/win-arm64" `
            -p:RequireNativeAssets=true
          exit $LASTEXITCODE
      - name: Check the package
        shell: pwsh
        run: |
          python scripts/ci/tests/test_pack_inventory.py "build/nupkg/TimeTug.Engine.$env:VERSION.nupkg" --version $env:VERSION
          exit $LASTEXITCODE
      - name: Measure the package
        shell: pwsh
        run: ./dotnet/pack/measure-size.ps1 -NativeRoot build/native -Package "build/nupkg/TimeTug.Engine.$env:VERSION.nupkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TimeTug.Engine-${{ needs.nuget-version.outputs.version }}
          path: build/nupkg/*.nupkg
          if-no-files-found: error

  # Pushes the package with nuget.org trusted publishing: a short-lived key from GitHub OIDC (NuGet/login), no stored
  # secret. Releases only; nuget.org versions are immutable and --skip-duplicate makes a re-run safe.
  publish-nuget:
    needs: [publish, nuget-version, nuget-pack]
    if: ${{ !cancelled() && needs.publish.outputs.version != '' && needs.nuget-pack.result == 'success' }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the trusted-publishing setup
        id: setup
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::notice::nuget.org trusted publishing is not configured; package built and tested, not pushed"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.setup.outputs.configured == 'true'
        with:
          name: TimeTug.Engine-${{ needs.nuget-version.outputs.version }}
          path: build/nupkg
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.setup.outputs.configured == 'true'
        with:
          dotnet-version: 8.0.x
      - name: Log in to nuget.org (OIDC)
        id: login
        if: steps.setup.outputs.configured == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        if: steps.setup.outputs.configured == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.nuget-version.outputs.version }}
        run: |
          dotnet nuget push "build/nupkg/TimeTug.Engine.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "::notice::TimeTug.Engine $VERSION pushed to nuget.org"
