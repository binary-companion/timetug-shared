[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/binary-companion/timetug-shared"

# Exact versions (conventions section 3), the same as calendar-connectors (newest release when phase 0 started,
# 2026-11-10). Default features are off wherever the crate builds without them.
[workspace.dependencies]
timetug-core = { path = "crates/timetug-core" }
timetug-bridge = { path = "crates/timetug-bridge" }
timetug-engine = { path = "crates/timetug-engine" }
timetug-engine-protocol = { path = "crates/timetug-engine-protocol" }

# The connector library, by released git tag (2.0.0 since the phase 4 cutover; scripts/ci/bump-cargo-dependency.py
# moves it, and the bump workflow runs that script for every connector release). To build against a local checkout instead,
# run scripts/dev/use-local-connectors.sh <path> (it writes a git-ignored cargo config; never commit a [patch]).
calendar-core = { git = "https://github.com/binary-companion/calendar-connectors", tag = "2.0.0" }
calendar-oauth = { git = "https://github.com/binary-companion/calendar-connectors", tag = "2.0.0" }
calendar-ical = { git = "https://github.com/binary-companion/calendar-connectors", tag = "2.0.0" }
calendar-google = { git = "https://github.com/binary-companion/calendar-connectors", tag = "2.0.0" }
calendar-microsoft = { git = "https://github.com/binary-companion/calendar-connectors", tag = "2.0.0" }
calendar-caldav = { git = "https://github.com/binary-companion/calendar-connectors", tag = "2.0.0" }
calendar-ical-subscription = { git = "https://github.com/binary-companion/calendar-connectors", tag = "2.0.0" }
calendar-test-support = { git = "https://github.com/binary-companion/calendar-connectors", tag = "2.0.0" }

serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# The zone database: the system one on macOS and Linux, a bundled one on Windows, iOS and Android (jiff-tzdb-platform).
jiff = { version = "=0.2.42", default-features = false, features = ["serde", "std", "tz-system", "tz-fat", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"] }
quick-xml = { version = "=0.42.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
uuid = { version = "=1.29.2", default-features = false, features = ["v4"] }
url = { version = "=2.5.8", default-features = false, features = ["std"] }
thiserror = { version = "=2.0.21", default-features = false }
async-trait = { version = "=0.1.92" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
# The bindings generator runtime: only timetug-engine-ffi depends on it (design section 6.2). No `tokio` feature: it would pull
# `async-compat` and a multi-thread runtime (docs/bindings-spike.md).
uniffi = { version = "=0.32.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The static library inside the XCFramework (scripts/dev/build-xcframework.sh): the release profile, keeping the symbols
# the final link of an app needs (docs/bindings-spike.md, section 4).
[profile.release-apple]
inherits = "release"
strip = "debuginfo"
