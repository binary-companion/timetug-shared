[bindings.swift]
module_name = "TimeTugSpike"
ffi_module_name = "TimeTugSpikeFFI"
generate_immutable_records = false
generate_codable_conformance = false

[bindings.swift.custom_types.Timestamp]
type_name = "Date"
imports = ["Foundation"]
lift = "Date(timeIntervalSince1970: Double({}) / 1000.0)"
lower = "Int64(({}.timeIntervalSince1970 * 1000.0).rounded())"

[bindings.swift.custom_types.Zone]
type_name = "TimeZone"
imports = ["Foundation"]
lift = "TimeZone(identifier: {}) ?? TimeZone(secondsFromGMT: 0)!"
lower = "{}.identifier"

[bindings.swift.custom_types.UrlString]
type_name = "URL"
imports = ["Foundation"]
lift = "URL(string: {})!"
lower = "{}.absoluteString"

[bindings.swift.custom_types.Uid]
type_name = "UUID"
imports = ["Foundation"]
lift = "UUID(uuidString: {})!"
lower = "{}.uuidString"

[bindings.kotlin.custom_types.Timestamp]
type_name = "java.time.Instant"
lift = "java.time.Instant.ofEpochMilli({})"
lower = "{}.toEpochMilli()"

[bindings.swift.rename]
Calendar = "CalendarRecord"
